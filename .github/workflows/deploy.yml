name: Build & Deploy Kestrel Finance to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: asia-south1
  ARTIFACT_REPO: kestrel
  SERVICE_NAME: kestrel-finance

jobs:
  test:
    name: Unit & Domain Rules Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Build & Lint Check
        run: npm run build

      - name: Domain Rules Verification Battery (100% Gates)
        run: npm test

      - name: Vitest Integration Suite
        run: npm run test:vitest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Business Rules Test Suite
        run: python -m unittest discover backend/tests

  docker-smoke-test:
    name: Container Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: docker build -t kestrel-finance:ci .

      - name: Smoke Test Running Container
        run: |
          docker run -d --name kestrel-ci-test -p 8080:8080 kestrel-finance:ci
          sleep 4
          curl -fsS http://127.0.0.1:8080/ | grep -q "Kestrel"
          docker rm -f kestrel-ci-test

  deploy-gcp:
    name: Deploy to GCP Cloud Run
    needs: docker-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check GCP Authentication Credentials
        id: check
        env:
          SA_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [[ -n "$SA_JSON" ]]; then
            echo "mode=json" >> "$GITHUB_OUTPUT"
          elif [[ -n "$WIF_PROVIDER" && -n "$GCP_SA" ]]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::warning::GCP credentials secret missing. To enable automatic deployment to GCP Cloud Run, add GCP_CREDENTIALS_JSON in repository secrets: https://github.com/${{ github.repository }}/settings/secrets/actions"
          fi

      - id: auth-json
        name: Authenticate with Service Account Key
        if: steps.check.outputs.mode == 'json'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - id: auth-wif
        name: Authenticate with Workload Identity Federation
        if: steps.check.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Resolve Active GCP Project ID
        id: gcp
        if: steps.check.outputs.mode != 'none'
        run: |
          PROJECT_ID="${{ steps.auth-json.outputs.project_id || steps.auth-wif.outputs.project_id }}"
          if [[ -z "$PROJECT_ID" ]]; then
            PROJECT_ID="slabspro-slabsuser34"
          fi
          echo "project_id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deploying Kestrel Finance to GCP project: ${PROJECT_ID}"

      - name: Setup Google Cloud SDK
        if: steps.check.outputs.mode != 'none'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.gcp.outputs.project_id }}

      - name: Configure Docker for GCP Artifact Registry
        if: steps.check.outputs.mode != 'none'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry Repository Exists
        if: steps.check.outputs.mode != 'none'
        run: |
          gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} \
            --location=${{ env.REGION }} --project=${{ steps.gcp.outputs.project_id }} >/dev/null 2>&1 || \
          gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
            --repository-format=docker --location=${{ env.REGION }} \
            --project=${{ steps.gcp.outputs.project_id }} || \
          echo "Using existing repository or permissions managed"

      - name: Build and Push OCI Image to GCP Artifact Registry
        if: steps.check.outputs.mode != 'none'
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ steps.gcp.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST="${{ env.REGION }}-docker.pkg.dev/${{ steps.gcp.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Deploy to Google Cloud Run
        id: deploy-cloudrun
        if: steps.check.outputs.mode != 'none'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ steps.gcp.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--port=8080 --cpu=1 --memory=512Mi --min-instances=0 --max-instances=5'

      - name: Enable Unauthenticated Public Ingress
        if: steps.check.outputs.mode != 'none'
        continue-on-error: true
        run: |
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --member=allUsers \
            --role=roles/run.invoker \
            --project=${{ steps.gcp.outputs.project_id }}

      - name: Output Deployment Summary
        if: steps.check.outputs.mode != 'none'
        run: |
          echo "### 🚀 GCP Cloud Run Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project ID:** ${{ steps.gcp.outputs.project_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** [${{ steps.deploy-cloudrun.outputs.url }}](${{ steps.deploy-cloudrun.outputs.url }})" >> $GITHUB_STEP_SUMMARY
