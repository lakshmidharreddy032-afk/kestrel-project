name: Build & Deploy Kestrel Finance to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: asia-south1
  ARTIFACT_REPO: northgate
  SERVICE_NAME: kestrel-finance

jobs:
  test:
    name: Unit & Domain Rules Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: TypeScript Build & Lint Check
        run: npm run build

      - name: Vitest Integration & Domain Rules Battery
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Business Rules Test Suite
        run: python -m unittest discover backend/tests

  docker-smoke-test:
    name: Container Build & Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: docker build -t kestrel-finance:ci .

      - name: Smoke Test Running Container
        run: |
          docker run -d --name kestrel-ci-test -p 8080:8080 kestrel-finance:ci
          sleep 4
          curl -fsS http://127.0.0.1:8080/ | grep -q "Kestrel"
          docker rm -f kestrel-ci-test

  deploy-gcp:
    name: Deploy to GCP Cloud Run
    needs: docker-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python for Credential Sanitization
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check and Sanitize GCP Credentials
        id: gcp-auth
        env:
          SA_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          python3 - << 'EOF'
          import os, re, json, sys

          sa_json = os.environ.get('SA_JSON', '').strip()
          wif_provider = os.environ.get('WIF_PROVIDER', '').strip()
          gcp_sa = os.environ.get('GCP_SA', '').strip()

          if sa_json:
              # 1. Clean literal newlines inside string literals so json.loads succeeds
              fixed = re.sub(
                  r'("private_key":\s*")(.*?)(")',
                  lambda m: m.group(1) + m.group(2).replace('\r', '').replace('\n', '\\n') + m.group(3),
                  sa_json,
                  flags=re.DOTALL
              )
              try:
                  data = json.loads(fixed)
              except Exception:
                  fixed = sa_json.replace('\r', '')
                  data = json.loads(fixed)

              # 2. Format PEM private key with strict headers and 64-character lines
              pk = data.get('private_key', '')
              clean_b64 = re.sub(r'-----BEGIN [A-Z ]+-----|-----END [A-Z ]+-----|\s+', '', pk)
              lines = [clean_b64[i:i+64] for i in range(0, len(clean_b64), 64)]
              data['private_key'] = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"

              creds_file = os.path.expanduser('~/gcp-key.json')
              with open(creds_file, 'w') as f:
                  json.dump(data, f)

              project_id = data.get('project_id', 'slabspro-slabsuser34')
              client_email = data.get('client_email', '')

              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("mode=json\n")
                  out.write(f"project_id={project_id}\n")
                  out.write(f"client_email={client_email}\n")
                  out.write(f"creds_file={creds_file}\n")

              print(f"✔ Successfully prepared key for project: {project_id} ({client_email})")

          elif wif_provider and gcp_sa:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("mode=wif\n")
                  out.write("project_id=slabspro-slabsuser34\n")
              print("✔ Configured for Workload Identity Federation")

          else:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write("mode=none\n")
              print("::warning::No GCP credentials found. Skipping Cloud Run deploy.")
          EOF

      - name: Authenticate with Service Account Key
        if: steps.gcp-auth.outputs.mode == 'json'
        run: |
          gcloud auth activate-service-account --key-file="${{ steps.gcp-auth.outputs.creds_file }}"
          gcloud config set project "${{ steps.gcp-auth.outputs.project_id }}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.gcp-auth.outputs.creds_file }}" >> $GITHUB_ENV

      - name: Authenticate with Workload Identity Federation
        id: auth-wif
        if: steps.gcp-auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for GCP Artifact Registry
        if: steps.gcp-auth.outputs.mode != 'none'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry Repository Exists
        if: steps.gcp-auth.outputs.mode != 'none'
        continue-on-error: true
        run: |
          PROJECT_ID="${{ steps.gcp-auth.outputs.project_id || steps.auth-wif.outputs.project_id }}"
          gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} \
            --location=${{ env.REGION }} --project="$PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
            --repository-format=docker --location=${{ env.REGION }} \
            --project="$PROJECT_ID" || true

      - name: Deploy to Google Cloud Run
        if: steps.gcp-auth.outputs.mode != 'none'
        id: deploy
        run: |
          PROJECT_ID="${{ steps.gcp-auth.outputs.project_id || steps.auth-wif.outputs.project_id }}"
          CREDS_FILE="${{ steps.gcp-auth.outputs.creds_file }}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

          echo "Authenticating Docker with Service Account key..."
          if [ -f "$CREDS_FILE" ]; then
            cat "$CREDS_FILE" | docker login -u _json_key --password-stdin "https://${{ env.REGION }}-docker.pkg.dev" || true
          fi

          DEPLOYED=false

          echo "Attempting OCI container push to Artifact Registry..."
          if docker build -t "$IMAGE" . && docker push "$IMAGE"; then
            echo "✔ Image pushed successfully. Deploying image to Cloud Run..."
            if gcloud run deploy ${{ env.SERVICE_NAME }} \
              --image="$IMAGE" \
              --region="${{ env.REGION }}" \
              --project="$PROJECT_ID" \
              --platform=managed \
              --allow-unauthenticated \
              --port=8080 \
              --cpu=1 \
              --memory=512Mi \
              --min-instances=0 \
              --max-instances=5; then
              DEPLOYED=true
            fi
          fi

          if [ "$DEPLOYED" = false ]; then
            echo "Artifact Registry push unavailable or restricted. Deploying directly via Cloud Build..."
            gcloud run deploy ${{ env.SERVICE_NAME }} \
              --source=. \
              --region="${{ env.REGION }}" \
              --project="$PROJECT_ID" \
              --platform=managed \
              --allow-unauthenticated \
              --port=8080 \
              --cpu=1 \
              --memory=512Mi \
              --min-instances=0 \
              --max-instances=5
          fi

          # Allow public traffic
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_NAME }} \
            --region="${{ env.REGION }}" \
            --project="$PROJECT_ID" \
            --member=allUsers \
            --role=roles/run.invoker || true

          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region="${{ env.REGION }}" \
            --project="$PROJECT_ID" \
            --format="value(status.url)")

          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "=========================================================="
          echo "🚀 LIVE PRODUCTION URL: ${URL}"
          echo "=========================================================="

      - name: Output Deployment Summary
        if: steps.gcp-auth.outputs.mode != 'none'
        run: |
          PROJECT_ID="${{ steps.gcp-auth.outputs.project_id || steps.auth-wif.outputs.project_id }}"
          echo "### 🚀 GCP Cloud Run Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project ID:** ${PROJECT_ID}" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL:** [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
