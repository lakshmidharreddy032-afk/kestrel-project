apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestrel-workflow
  namespace: kestrel-production
  labels:
    app.kubernetes.io/name: kestrel-workflow
    app.kubernetes.io/instance: production
    app.kubernetes.io/part-of: kestrel-lending-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: kestrel-workflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kestrel-workflow
    spec:
      containers:
        - name: kestrel-frontend
          image: kestrelregistry.azurecr.io/credit-workflow:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kestrel-workflow-svc
  namespace: kestrel-production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kestrel-workflow
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kestrel-workflow-hpa
  namespace: kestrel-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kestrel-workflow
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
