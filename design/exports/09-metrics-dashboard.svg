<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173d74"/>
      <stop offset="100%" stop-color="#1e56a0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fc"/>

  <!-- Top Header -->
  <rect width="1200" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="14" width="36" height="36" rx="8" fill="url(#headerGrad)"/>
  <text x="42" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
  <text x="70" y="34" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Kestrel Finance</text>
  <text x="70" y="48" font-family="Inter, sans-serif" font-size="11" fill="#64748b">SME Credit Document Workflow • Production Prototype</text>

  <!-- Stepper -->
  <rect y="64" width="1200" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1. Intake ➔ 2. Checklist ➔ 3. Gap Diagnostics ➔ 4. OCR ➔ 5. Analyst Gate ➔ 6. Spreading ➔ 7. Sanction ➔ 8. Audit ➔</text>
  <rect x="880" y="72" width="170" height="26" rx="6" fill="#eaf1fb" stroke="#1e56a0"/>
  <text x="965" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e56a0" text-anchor="middle">9. Metrics &amp; NPA [Active]</text>

  <g transform="translate(24, 126)">
    <text x="0" y="24" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Executive Operational Metrics &amp; Risk Appetite Guardrails</text>
    <text x="0" y="44" font-family="Inter, sans-serif" font-size="12.5" fill="#64748b">Comparing legacy manual appraisal baseline against Kestrel Finance production workflow.</text>

    <!-- Branch & Range Selector -->
    <rect x="830" y="14" width="180" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="844" y="34" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">All Branches (Consolidated)</text>
    <rect x="1022" y="14" width="130" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1036" y="34" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">FY26 Q3 (Current)</text>

    <!-- 4 Primary KPI Comparison Cards -->
    <g transform="translate(0, 64)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="270" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="16" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">Turnaround Time (TAT)</text>
      <rect x="194" y="10" width="64" height="18" rx="4" fill="#e6f7ef"/>
      <text x="226" y="23" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">↓ 35% Faster</text>
      <text x="16" y="58" font-family="JetBrains Mono, monospace" font-size="24" font-weight="800" fill="#1e56a0">11.8 Days</text>
      <text x="16" y="78" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Baseline: 18.2d • Target: ≤ 12.0d</text>
      <text x="16" y="96" font-family="Inter, sans-serif" font-size="10" fill="#0e6245">Intake to credit sanction sign-off</text>

      <!-- KPI 2 -->
      <rect x="294" y="0" width="270" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="310" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">Analyst Touch Time / File</text>
      <rect x="488" y="10" width="64" height="18" rx="4" fill="#e6f7ef"/>
      <text x="520" y="23" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">↓ 82% Touch</text>
      <text x="310" y="58" font-family="JetBrains Mono, monospace" font-size="24" font-weight="800" fill="#1e56a0">48 Minutes</text>
      <text x="310" y="78" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Baseline: 4.5 Hours • Target: ≤ 60m</text>
      <text x="310" y="96" font-family="Inter, sans-serif" font-size="10" fill="#0e6245">Eliminates manual figure re-typing</text>

      <!-- KPI 3 -->
      <rect x="588" y="0" width="270" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="604" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">Checklist Completeness</text>
      <rect x="782" y="10" width="64" height="18" rx="4" fill="#e6f7ef"/>
      <text x="814" y="23" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">↑ 29% Yield</text>
      <text x="604" y="58" font-family="JetBrains Mono, monospace" font-size="24" font-weight="800" fill="#1e56a0">91% Yield</text>
      <text x="604" y="78" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Baseline: 62% • Target: ≥ 85%</text>
      <text x="604" y="96" font-family="Inter, sans-serif" font-size="10" fill="#0e6245">Single-chase deficiency dispatch</text>

      <!-- KPI 4 -->
      <rect x="882" y="0" width="270" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="898" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#64748b">Figure Extraction Accuracy</text>
      <rect x="1076" y="10" width="64" height="18" rx="4" fill="#e6f7ef"/>
      <text x="1108" y="23" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">100% Check</text>
      <text x="898" y="58" font-family="JetBrains Mono, monospace" font-size="24" font-weight="800" fill="#0e6245">99.4%</text>
      <text x="898" y="78" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Baseline: 94.2% • Target: 100%</text>
      <text x="898" y="96" font-family="Inter, sans-serif" font-size="10" fill="#0e6245">Analyst gate prevents hallucinations</text>
    </g>

    <!-- TAT Elimination Breakdown Table -->
    <g transform="translate(0, 194)">
      <rect x="0" y="0" width="1152" height="230" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <rect x="0" y="0" width="1152" height="36" rx="10 10 0 0" fill="#f8fafd" stroke="#e2e8f0"/>
      <text x="16" y="23" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">OPERATIONAL LIFECYCLE STAGE</text>
      <text x="320" y="23" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">MANUAL BASELINE</text>
      <text x="500" y="23" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">KESTREL PROTOTYPE</text>
      <text x="700" y="23" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">EFFICIENCY GAIN</text>
      <text x="900" y="23" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">VISUAL REDUCTION</text>

      <!-- Stage 1 -->
      <text x="16" y="60" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">S1 Intake &amp; Day-One Checklist</text>
      <text x="320" y="60" font-family="Inter, sans-serif" font-size="12" fill="#64748b">3.5 Days</text>
      <text x="500" y="60" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1e56a0">0.5 Days</text>
      <text x="700" y="60" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0e6245">85% faster</text>
      <rect x="900" y="52" width="200" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="900" y="52" width="170" height="8" rx="4" fill="#10b981"/>

      <!-- Stage 2 -->
      <text x="16" y="92" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">S2 Document Deficiency Resolution</text>
      <text x="320" y="92" font-family="Inter, sans-serif" font-size="12" fill="#64748b">7.0 Days</text>
      <text x="500" y="92" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1e56a0">3.8 Days</text>
      <text x="700" y="92" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0e6245">45% faster</text>
      <rect x="900" y="84" width="200" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="900" y="84" width="90" height="8" rx="4" fill="#10b981"/>

      <!-- Stage 3 -->
      <text x="16" y="124" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">S3 Multi-Document Gap Check</text>
      <text x="320" y="124" font-family="Inter, sans-serif" font-size="12" fill="#64748b">2.2 Days</text>
      <text x="500" y="124" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1e56a0">0.2 Days</text>
      <text x="700" y="124" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0e6245">90% faster</text>
      <rect x="900" y="116" width="200" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="900" y="116" width="180" height="8" rx="4" fill="#10b981"/>

      <!-- Stage 4 -->
      <text x="16" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">S4 OCR Extraction &amp; Analyst Check</text>
      <text x="320" y="156" font-family="Inter, sans-serif" font-size="12" fill="#64748b">3.0 Days</text>
      <text x="500" y="156" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1e56a0">0.8 Days</text>
      <text x="700" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0e6245">73% faster</text>
      <rect x="900" y="148" width="200" height="8" rx="4" fill="#e2e8f0"/>
      <rect x="900" y="148" width="146" height="8" rx="4" fill="#10b981"/>
    </g>

    <!-- Gross Portfolio NPA Risk Appetite Guardrail -->
    <g transform="translate(0, 444)">
      <rect x="0" y="0" width="1152" height="150" rx="10" fill="#ffffff" stroke="#a3e6cb" filter="url(#shadow)"/>
      <g transform="translate(24, 20)">
        <text x="0" y="16" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Non-Negotiable Risk Guardrail: Gross Portfolio NPA Rate</text>
        <rect x="980" y="0" width="124" height="24" rx="12" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="1042" y="16" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0e6245" text-anchor="middle">✔ Within Appetite</text>
        <text x="0" y="38" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Faster decisioning does not compromise credit quality. Portfolio NPA is tracked continuously against Board limits.</text>

        <text x="0" y="80" font-family="JetBrains Mono, monospace" font-size="34" font-weight="800" fill="#0e6245">3.1% <tspan font-size="14" font-weight="500" fill="#0f172a">Gross NPA</tspan></text>
        <text x="170" y="74" font-family="Inter, sans-serif" font-size="13" fill="#334155">vs Board Ceiling Limit of <strong>3.5%</strong> (<strong style="fill: #0e6245;">0.4% safe risk headroom</strong> preserved)</text>

        <!-- Gauge Bar -->
        <rect x="0" y="96" width="1104" height="12" rx="6" fill="#e2e8f0"/>
        <rect x="0" y="96" width="979" height="12" rx="6" fill="#10b981"/>
      </g>
    </g>
  </g>
</svg>
