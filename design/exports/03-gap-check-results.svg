    <!-- Diagnostic Rule Cards Grid -->
    <g transform="translate(0, 190)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="368" height="180" rx="10" fill="#ffffff" stroke="#a3e6cb" filter="url(#shadow)"/>
      <text x="16" y="28" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#64748b">GAP-201</text>
      <rect x="280" y="14" width="72" height="20" rx="4" fill="#e6f7ef"/>
      <text x="316" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASSED</text>
      <text x="16" y="56" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0e6245">Duplicate Page &amp; Hash Check</text>
      <text x="16" y="80" font-family="Inter, sans-serif" font-size="12" fill="#334155">Zero SHA-256 identical transaction hash collisions detected across uploaded bank statements.</text>
      <line x1="16" y1="130" x2="352" y2="130" stroke="#f1f5f9"/>
      <text x="16" y="152" font-family="Inter, sans-serif" font-size="11" fill="#64748b"><strong>Prescribed Action:</strong> No action required.</text>

      <!-- Card 2 -->
      <rect x="392" y="0" width="368" height="180" rx="10" fill="#ffffff" stroke="#fde09e" filter="url(#shadow)"/>
      <text x="408" y="28" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#64748b">GAP-102</text>
      <rect x="672" y="14" width="72" height="20" rx="4" fill="#fef7e6"/>
      <text x="708" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#8a5700" text-anchor="middle">WARNING</text>
      <text x="408" y="56" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8a5700">Missing Partnership Deed</text>
      <text x="408" y="80" font-family="Inter, sans-serif" font-size="12" fill="#334155">Mandatory constitutional proof is missing from intake packet for LLP constitution.</text>
      <line x1="408" y1="130" x2="744" y2="130" stroke="#f1f5f9"/>
      <text x="408" y="152" font-family="Inter, sans-serif" font-size="11" fill="#64748b"><strong>Prescribed Action:</strong> Deficiency notice dispatched via WhatsApp.</text>

      <!-- Card 3 -->
      <rect x="784" y="0" width="368" height="180" rx="10" fill="#ffffff" stroke="#a3e6cb" filter="url(#shadow)"/>
      <text x="800" y="28" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#64748b">GAP-205</text>
      <rect x="1064" y="14" width="72" height="20" rx="4" fill="#e6f7ef"/>
      <text x="1100" y="28" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASSED</text>
      <text x="800" y="56" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0e6245">Financial Year Validity Check</text>
      <text x="800" y="80" font-family="Inter, sans-serif" font-size="12" fill="#334155">Filings correspond to active assessment year FY 2025-26. No expired financial filings.</text>
      <line x1="800" y1="130" x2="1136" y2="130" stroke="#f1f5f9"/>
      <text x="800" y="152" font-family="Inter, sans-serif" font-size="11" fill="#64748b"><strong>Prescribed Action:</strong> In order for financial spreading.</text>
