  </defs>

  <rect width="1200" height="800" fill="#f6f8fc"/>

  <!-- Header -->
  <rect width="1200" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="14" width="36" height="36" rx="8" fill="url(#headerGrad)"/>
  <text x="42" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
  <text x="70" y="34" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Kestrel Finance</text>
  <text x="70" y="48" font-family="Inter, sans-serif" font-size="11" fill="#64748b">SME Credit Document Workflow • Production Prototype</text>
  <rect x="200" y="24" width="128" height="20" rx="10" fill="#eaf1fb" stroke="#bcd5f6"/>
  <text x="264" y="38" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1e56a0" text-anchor="middle">PROTOTYPE: MOCK DATA</text>

  <!-- Stepper -->
  <rect y="64" width="1200" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1. Intake Queue ➔ 2. Day-1 Checklist ➔</text>
  <rect x="250" y="72" width="160" height="26" rx="6" fill="#eaf1fb" stroke="#1e56a0"/>
  <text x="330" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e56a0" text-anchor="middle">3. Gap Diagnostics [Active]</text>
  <text x="420" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">➔ 4. OCR Split-View ➔ 5. Spreading Sheet ➔ 6. Credit Sanction</text>

  <g transform="translate(24, 130)">
    <text x="0" y="20" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Automated Document Gap Diagnostics (Solution S3)</text>
    <text x="0" y="38" font-family="Inter, sans-serif" font-size="12.5" fill="#64748b">Deterministic cross-validation heuristics detecting statement continuity breaks, duplicate files, and turnover mismatches.</text>

    <rect x="960" y="10" width="192" height="34" rx="8" fill="#1e56a0"/>
    <text x="1056" y="32" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⚡ Re-run Diagnostic Engine</text>

    <!-- Cross-Reconciliation Summary Card -->
    <rect x="0" y="60" width="1152" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    
    <g transform="translate(24, 80)">
      <text x="0" y="16" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">GSTR-3B Taxable Turnover</text>
      <text x="0" y="44" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="#0f172a">₹ 1,62,00,000</text>
      <text x="0" y="62" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">Table 3.1 Outward supplies</text>

      <text x="260" y="16" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Annualized Bank Credits</text>
      <text x="260" y="44" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="#0f172a">₹ 1,69,00,000</text>
      <text x="260" y="62" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">6M operational credits × 2</text>

      <text x="520" y="16" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">GST vs Banking Reconciliation</text>
      <text x="520" y="44" font-family="JetBrains Mono, monospace" font-size="20" font-weight="800" fill="#0e6245">+4.32%</text>
      <rect x="620" y="28" width="90" height="20" rx="4" fill="#e6f7ef"/>
      <text x="665" y="42" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASSED (&lt; 15%)</text>
      <text x="520" y="62" font-family="Inter, sans-serif" font-size="10.5" fill="#0e6245">Variance within policy appetite</text>

      <text x="800" y="16" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Statement Period Continuity (6 Months)</text>
      <g transform="translate(800, 30)">
        <rect x="0" y="0" width="40" height="20" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="20" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">May ✓</text>
        <rect x="46" y="0" width="40" height="20" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="66" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">Jun ✓</text>
        <rect x="92" y="0" width="40" height="20" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="112" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">Jul ✓</text>
        <rect x="138" y="0" width="40" height="20" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="158" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">Aug ✓</text>
        <rect x="184" y="0" width="40" height="20" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="204" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">Sep ✓</text>
        <rect x="230" y="0" width="40" height="20" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
        <text x="250" y="14" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0e6245" text-anchor="middle">Oct ✓</text>
      </g>
      <text x="800" y="62" font-family="Inter, sans-serif" font-size="10.5" fill="#0e6245">Zero missing monthly statement gaps</text>
