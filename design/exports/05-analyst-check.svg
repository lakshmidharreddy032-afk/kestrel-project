<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173d74"/>
      <stop offset="100%" stop-color="#1e56a0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fc"/>

  <!-- Top Header -->
  <rect width="1200" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="14" width="36" height="36" rx="8" fill="url(#headerGrad)"/>
  <text x="42" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
  <text x="70" y="34" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Kestrel Finance</text>
  <text x="70" y="48" font-family="Inter, sans-serif" font-size="11" fill="#64748b">SME Credit Document Workflow • Production Prototype</text>

  <!-- Stepper -->
  <rect y="64" width="1200" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1. Intake ➔ 2. Checklist ➔ 3. Gap Diagnostics ➔ 4. OCR Split-View ➔</text>
  <rect x="420" y="72" width="160" height="26" rx="6" fill="#eaf1fb" stroke="#1e56a0"/>
  <text x="500" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e56a0" text-anchor="middle">5. Analyst Gate [Active]</text>
  <text x="590" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">➔ 6. Spreading Sheet ➔ 7. Credit Sanction</text>

  <g transform="translate(24, 126)">
    <!-- Header -->
    <text x="0" y="24" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Analyst Verification Gate (Solution S4 Step 3 &amp; 4)</text>
    <text x="0" y="44" font-family="Inter, sans-serif" font-size="12.5" fill="#64748b">Mandatory human check: Spreading sheet synchronization is strictly locked until a Credit Analyst checks 100% of figures.</text>

    <!-- Verification Gate Progress Bar Card -->
    <rect x="0" y="60" width="1152" height="74" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <text x="20" y="88" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Analyst Verification Gate: <tspan fill="#0e6245">6 of 6 figures verified (100%)</tspan></text>
    <rect x="940" y="74" width="190" height="24" rx="4" fill="#e6f7ef"/>
    <text x="1035" y="90" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0e6245" text-anchor="middle">✔ SPREADING SYNC UNLOCKED</text>
    <!-- Progress Bar -->
    <rect x="20" y="104" width="1112" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="20" y="104" width="1112" height="8" rx="4" fill="#10b981"/>

    <!-- Left Column: Verification Action List -->
    <rect x="0" y="150" width="680" height="460" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="0" y="150" width="680" height="40" rx="10 10 0 0" fill="#f8fafd" stroke="#e2e8f0"/>
    <text x="16" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#64748b">METRIC &amp; SOURCE</text>
    <text x="320" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#64748b">VALUE</text>
    <text x="440" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#64748b">STATUS</text>
    <text x="560" y="174" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">ANALYST ACTION</text>

    <!-- Item 1 -->
    <rect x="0" y="190" width="680" height="54" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="16" y="214" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Total Operational Credits (6M)</text>
    <text x="16" y="230" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Page 1 • Confidence 98%</text>
    <text x="320" y="222" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#0f172a">₹ 84,50,000</text>
    <rect x="440" y="208" width="68" height="20" rx="4" fill="#e6f7ef"/>
    <text x="474" y="222" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">Confirmed</text>
    <rect x="530" y="206" width="60" height="24" rx="4" fill="#e6f7ef" stroke="#a3e6cb"/>
    <text x="560" y="222" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0e6245" text-anchor="middle">✔ Checked</text>
    <rect x="600" y="206" width="56" height="24" rx="4" fill="#f3effe" stroke="#d4c5fb"/>
    <text x="628" y="222" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#5534b8" text-anchor="middle">✎ Edit</text>

    <!-- Item 2 (Overridden) -->
    <rect x="0" y="244" width="680" height="54" fill="#fbfaff" stroke="#d4c5fb"/>
    <text x="16" y="268" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Total Operational Debits (6M)</text>
    <text x="16" y="284" font-family="Inter, sans-serif" font-size="10" fill="#5534b8">Overridden by Meena Sharma (Analyst)</text>
    <text x="320" y="276" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#5534b8">₹ 78,20,000</text>
    <rect x="440" y="262" width="68" height="20" rx="4" fill="#f3effe"/>
    <text x="474" y="276" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#5534b8" text-anchor="middle">Overridden</text>
    <rect x="530" y="260" width="126" height="24" rx="4" fill="#f3effe" stroke="#d4c5fb"/>
    <text x="593" y="276" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#5534b8" text-anchor="middle">Audited Override</text>

    <!-- Right Column: Override Diff Modal Preview -->
    <rect x="704" y="150" width="448" height="460" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="704" y="150" width="448" height="40" rx="10 10 0 0" fill="#f8fafd" stroke="#e2e8f0"/>
    <text x="724" y="174" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Analyst Figure Override &amp; Justification Modal</text>

    <g transform="translate(724, 206)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Extracted Model Value (Page 1):</text>
      <rect x="0" y="22" width="408" height="34" rx="6" fill="#f8fafd" stroke="#e2e8f0"/>
      <text x="12" y="44" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#64748b">₹ 78,20,000 (OCR Confidence: 97.4%)</text>

      <text x="0" y="78" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Verified / Corrected Value (₹):</text>
      <rect x="0" y="86" width="408" height="34" rx="6" fill="#ffffff" stroke="#1e56a0"/>
      <text x="12" y="108" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">₹ 75,00,000</text>
      <text x="0" y="134" font-family="Inter, sans-serif" font-size="10.5" font-weight="600" fill="#a52336">Variance: -₹3,20,000 (-4.1%)</text>

      <text x="0" y="158" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f172a">Mandatory Rationale Reason (min 5 chars):</text>
      <rect x="0" y="166" width="408" height="74" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="12" y="188" font-family="Inter, sans-serif" font-size="11.5" fill="#0f172a">Excluded internal inter-account transfer contra entry;</text>
      <text x="12" y="206" font-family="Inter, sans-serif" font-size="11.5" fill="#0f172a">verified against HDFC statement page 1 transaction log.</text>

      <!-- Action Buttons -->
      <rect x="236" y="256" width="172" height="34" rx="6" fill="#1e56a0"/>
      <text x="322" y="278" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Save Override &amp; Log Audit</text>
    </g>
  </g>
</svg>
