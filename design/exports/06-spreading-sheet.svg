    <text x="640" y="324" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASS</text>

    <!-- Ratio 5 -->
    <rect x="0" y="342" width="720" height="44" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="16" y="369" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Net Profit Margin (PAT %)</text>
    <text x="280" y="369" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">6.8%</text>
    <text x="440" y="369" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">≥ 5.0% target</text>
