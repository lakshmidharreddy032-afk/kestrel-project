      <text x="0" y="130" font-family="Inter, sans-serif" font-size="11" fill="#334155">Character (Promoter KYC, CIBIL 740)</text>
      <text x="340" y="130" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0f172a">18/20</text>
      <rect x="0" y="136" width="376" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="0" y="136" width="338" height="5" rx="2.5" fill="#1e56a0"/>

      <text x="0" y="162" font-family="Inter, sans-serif" font-size="11" fill="#334155">Capacity (DSCR 1.82x, Monthly Accruals)</text>
      <text x="340" y="162" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0f172a">22/25</text>
      <rect x="0" y="168" width="376" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="0" y="168" width="330" height="5" rx="2.5" fill="#1e56a0"/>

      <text x="0" y="194" font-family="Inter, sans-serif" font-size="11" fill="#334155">Capital (Net Worth ₹68L, Debt/Equity)</text>
      <text x="340" y="194" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0f172a">14/20</text>
      <rect x="0" y="200" width="376" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="0" y="200" width="263" height="5" rx="2.5" fill="#1e56a0"/>

      <text x="0" y="226" font-family="Inter, sans-serif" font-size="11" fill="#334155">Collateral (Hypothecation of Book Debts)</text>
      <text x="340" y="226" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0f172a">10/15</text>
      <rect x="0" y="232" width="376" height="5" rx="2.5" fill="#e2e8f0"/>
      <rect x="0" y="232" width="250" height="5" rx="2.5" fill="#1e56a0"/>

      <!-- Governance Notice -->
      <rect x="0" y="260" width="376" height="50" rx="6" fill="#f8fafc" stroke="#bcd5f6"/>
      <text x="12" y="280" font-family="Inter, sans-serif" font-size="10.5" fill="#334155">🛡 <strong>Scorecard model is existing and unchanged.</strong></text>
      <text x="12" y="296" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Extraction tools assist with figure intake only. Risk score is untouched.</text>
    </g>
  </g>
</svg>
