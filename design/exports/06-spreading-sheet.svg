    <rect x="0" y="210" width="720" height="44" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="16" y="237" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Interest Coverage Ratio (ICR)</text>
    <text x="280" y="237" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">3.40x</text>
    <text x="440" y="237" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">≥ 2.00x target policy</text>
    <rect x="615" y="222" width="50" height="20" rx="4" fill="#e6f7ef"/>
    <text x="640" y="236" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASS</text>

    <!-- Ratio 3 -->
    <rect x="0" y="254" width="720" height="44" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="16" y="281" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Current Ratio (Working Capital)</text>
    <text x="280" y="281" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">1.42x</text>
    <text x="440" y="281" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">&gt; 1.25x target policy</text>
    <rect x="615" y="266" width="50" height="20" rx="4" fill="#e6f7ef"/>
    <text x="640" y="280" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASS</text>

    <!-- Ratio 4 -->
