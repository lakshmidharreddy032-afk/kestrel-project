    <!-- Stress Testing Sensitivity Bar -->
    <rect x="0" y="60" width="1152" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <text x="20" y="91" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">⚡ Stress Test Simulator: Revenue Shock Sensitivity (0% Baseline)</text>
    <rect x="560" y="80" width="400" height="8" rx="4" fill="#e2e8f0"/>
    <circle cx="760" cy="84" r="9" fill="#1e56a0"/>
    <text x="980" y="90" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1e56a0">DSCR: 1.82x</text>

    <!-- Left Column: Core Financial Ratios Table -->
    <rect x="0" y="128" width="720" height="480" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="0" y="128" width="720" height="38" rx="10 10 0 0" fill="#f8fafd" stroke="#e2e8f0"/>
