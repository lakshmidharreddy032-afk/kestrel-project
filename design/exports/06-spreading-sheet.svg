  <text x="24" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1. Intake ➔ 2. Checklist ➔ 3. Gap Diagnostics ➔ 4. OCR ➔ 5. Analyst Gate ➔</text>
  <rect x="520" y="72" width="180" height="26" rx="6" fill="#eaf1fb" stroke="#1e56a0"/>
  <text x="610" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e56a0" text-anchor="middle">6. Spreading &amp; Scorecard [Active]</text>
  <text x="710" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">➔ 7. Credit Sanction</text>

  <g transform="translate(24, 126)">
