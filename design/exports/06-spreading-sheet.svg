    <text x="16" y="325" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Debt-to-Equity Ratio</text>
    <text x="280" y="325" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">0.82x</text>
    <text x="440" y="325" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">&lt; 1.50x benchmark</text>
