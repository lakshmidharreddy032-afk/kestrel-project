    <text x="280" y="152" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">CALCULATED VALUE</text>
    <text x="440" y="152" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">BENCHMARK POLICY</text>
    <text x="640" y="152" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">STATUS</text>

    <!-- Ratio 1 -->
    <rect x="0" y="166" width="720" height="44" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="16" y="193" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Debt Service Coverage Ratio (DSCR)</text>
    <text x="280" y="193" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">1.82x</text>
    <text x="440" y="193" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">≥ 1.50x target policy</text>
    <rect x="615" y="178" width="50" height="20" rx="4" fill="#e6f7ef"/>
    <text x="640" y="192" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">PASS</text>

