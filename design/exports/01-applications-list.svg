    <text x="20" y="316" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#a52336">APP-1004</text>
    <text x="120" y="311" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Horizon Infra Developers</text>
    <text x="120" y="325" font-family="Inter, sans-serif" font-size="10.5" fill="#a52336">Private Limited • Exceeds ₹25L Policy Limit</text>
    <text x="360" y="316" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Infrastructure</text>
    <text x="520" y="316" font-family="JetBrains Mono, monospace" font-size="12" font-weight="800" fill="#a52336">₹ 45,00,000</text>
