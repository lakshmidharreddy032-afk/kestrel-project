    <rect x="750" y="252" width="120" height="22" rx="11" fill="#fef7e6"/>
    <text x="810" y="267" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#8a5700" text-anchor="middle">Documents Needed</text>
    <rect x="910" y="252" width="110" height="22" rx="4" fill="#e6f7ef"/>
    <text x="965" y="267" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0e6245" text-anchor="middle">✔ Eligible (&lt; ₹25L)</text>
    <rect x="1040" y="252" width="80" height="24" rx="4" fill="#ffffff" stroke="#1e56a0"/>
    <text x="1080" y="268" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1e56a0" text-anchor="middle">Open Case</text>

