  <text x="458" y="36" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">VM</text>
  <text x="476" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Vikram (RM)</text>
