      <stop offset="0%" stop-color="#173d74"/>
      <stop offset="100%" stop-color="#1e56a0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafd"/>
