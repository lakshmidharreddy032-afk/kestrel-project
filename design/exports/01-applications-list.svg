  <rect x="1090" y="18" width="86" height="28" rx="6" fill="#f8fafd" stroke="#e2e8f0"/>
  <text x="1133" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">🌙 Dark</text>

