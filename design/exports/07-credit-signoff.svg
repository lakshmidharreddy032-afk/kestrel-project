<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173d74"/>
      <stop offset="100%" stop-color="#1e56a0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fc"/>

  <!-- Top Header -->
  <rect width="1200" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="14" width="36" height="36" rx="8" fill="url(#headerGrad)"/>
  <text x="42" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
  <text x="70" y="34" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Kestrel Finance</text>
  <text x="70" y="48" font-family="Inter, sans-serif" font-size="11" fill="#64748b">SME Credit Document Workflow • Production Prototype</text>

  <!-- Stepper -->
  <rect y="64" width="1200" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1. Intake ➔ 2. Checklist ➔ 3. Gap Diagnostics ➔ 4. OCR ➔ 5. Analyst Gate ➔ 6. Spreading ➔</text>
  <rect x="640" y="72" width="180" height="26" rx="6" fill="#eaf1fb" stroke="#1e56a0"/>
  <text x="730" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e56a0" text-anchor="middle">7. Credit Sanction [Active]</text>

  <g transform="translate(24, 126)">
    <text x="0" y="24" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#0f172a">Credit Officer Sign-off Gate (Step 6 Delegated Authority)</text>
    <text x="0" y="44" font-family="Inter, sans-serif" font-size="12.5" fill="#64748b">Mandatory human credit sign-off: Only a designated Credit Officer (Arjun Iyer) can execute sanction. Minimum 10 characters rationale required.</text>

    <!-- Executive Credit Appraisal Memo (CAM) Card -->
    <rect x="0" y="60" width="1152" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <g transform="translate(20, 80)">
      <text x="0" y="14" font-family="Inter, sans-serif" font-size="11" fill="#64748b">BORROWER ENTITY</text>
      <text x="0" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Malabar Spices &amp; Agro LLP</text>
      <text x="0" y="52" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Sector: Agro-Processing</text>

      <text x="240" y="14" font-family="Inter, sans-serif" font-size="11" fill="#64748b">FACILITY &amp; LIMIT</text>
      <text x="240" y="36" font-family="JetBrains Mono, monospace" font-size="16" font-weight="800" fill="#1e56a0">₹ 18,00,000</text>
      <text x="240" y="52" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0e6245">Working Capital Term Loan</text>

      <text x="480" y="14" font-family="Inter, sans-serif" font-size="11" fill="#64748b">INTEREST RATE &amp; TENOR</text>
      <text x="480" y="36" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#0f172a">14.25% p.a. • 24M</text>
      <text x="480" y="52" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Monthly Equated EMI</text>

      <text x="740" y="14" font-family="Inter, sans-serif" font-size="11" fill="#64748b">PRIMARY COLLATERAL</text>
      <text x="740" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0e6245">1.32x Coverage Ratio</text>
      <text x="740" y="52" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Hypothecation of Book Debts</text>

      <text x="960" y="14" font-family="Inter, sans-serif" font-size="11" fill="#64748b">RISK RATING TIER</text>
      <text x="960" y="36" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1e56a0">Score: 68/100</text>
      <text x="960" y="52" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Tier B (Moderate Risk)</text>
    </g>

    <!-- Sign-off Action Form & Sanction Letter Preview -->
    <rect x="0" y="174" width="600" height="430" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <g transform="translate(24, 196)">
      <text x="0" y="16" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Mandatory Credit Officer Underwriting Rationale:</text>
      <text x="480" y="16" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0e6245">82 / 10 chars ✔</text>
      
      <rect x="0" y="28" width="552" height="90" rx="6" fill="#f8fafd" stroke="#cbd5e1"/>
      <text x="14" y="52" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">Facility approved. DSCR 1.82x exceeds 1.35x benchmark with clean HDFC bank conduct.</text>
      <text x="14" y="70" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">Strong annual GST turnover (₹1.62 Cr) and stable monthly AMB > ₹4.8 Lakh.</text>
      <text x="14" y="88" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">Hypothecation charge registered on stock &amp; receivables.</text>

      <!-- Quick Rationale Chips -->
      <text x="0" y="140" font-family="Inter, sans-serif" font-size="11.5" fill="#64748b">Pre-approved Underwriting Templates:</text>
      <rect x="0" y="150" width="260" height="24" rx="4" fill="#f1f5f9"/>
      <text x="130" y="166" font-family="Inter, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">DSCR &gt; 1.5x with clean banking conduct</text>
      <rect x="270" y="150" width="260" height="24" rx="4" fill="#f1f5f9"/>
      <text x="400" y="166" font-family="Inter, sans-serif" font-size="10.5" fill="#334155" text-anchor="middle">Strong GST turnover &amp; stable AMB</text>

      <!-- Decision Action Buttons -->
      <g transform="translate(0, 200)">
        <rect x="0" y="0" width="220" height="42" rx="8" fill="#0e6245"/>
        <text x="110" y="26" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✔ Sanction &amp; Approve</text>

        <rect x="236" y="0" width="180" height="42" rx="8" fill="#fef7e6" stroke="#fde09e"/>
        <text x="326" y="26" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#8a5700" text-anchor="middle">⚖️ Refer to Committee</text>

        <rect x="430" y="0" width="122" height="42" rx="8" fill="#fdf0f2" stroke="#f8b4be"/>
        <text x="491" y="26" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#a52336" text-anchor="middle">✕ Reject</text>
      </g>
    </g>

    <!-- Formal Sanction Letter Modal Preview -->
    <rect x="624" y="174" width="528" height="430" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <g transform="translate(648, 196)">
      <text x="0" y="18" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#1e56a0">KESTREL FINANCE LIMITED</text>
      <text x="0" y="34" font-family="Inter, sans-serif" font-size="10" fill="#64748b">RBI Reg. No: B-14.02941 • NBFC-Middle Layer • BKC, Mumbai</text>
      <line x1="0" y1="42" x2="480" y2="42" stroke="#1e56a0" stroke-width="1.5"/>

      <text x="0" y="62" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Ref: KF/SME/2026/0842</text>
      <text x="380" y="62" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Date: 14 Nov 2026</text>

      <text x="0" y="86" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">To: Malabar Spices &amp; Agro LLP</text>
      <text x="0" y="104" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Sub: In-principle Sanction of SME Working Capital Loan</text>

      <!-- Terms Table -->
      <rect x="0" y="118" width="480" height="130" fill="#f8fafd" stroke="#e2e8f0" rx="4"/>
      <text x="14" y="142" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sanctioned Limit:</text>
      <text x="180" y="142" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1e56a0">₹ 18,00,000</text>

      <text x="14" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Facility Type:</text>
      <text x="180" y="168" font-family="Inter, sans-serif" font-size="11.5" fill="#0f172a">SME Secured Term Loan</text>

      <text x="14" y="194" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Rate of Interest:</text>
      <text x="180" y="194" font-family="Inter, sans-serif" font-size="11.5" fill="#0f172a">14.25% p.a. floating</text>

      <text x="14" y="220" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b">Sanctioning Officer:</text>
      <text x="180" y="220" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Arjun Iyer (Credit Officer)</text>

      <rect x="290" y="260" width="190" height="34" rx="6" fill="#1e56a0"/>
      <text x="385" y="282" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">📥 Download Sanction Memo</text>
    </g>
  </g>
</svg>
