<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173d74"/>
      <stop offset="100%" stop-color="#1e56a0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#f6f8fc"/>

  <!-- Top Header -->
  <rect width="1200" height="64" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="14" width="36" height="36" rx="8" fill="url(#headerGrad)"/>
  <text x="42" y="38" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">K</text>
  <text x="70" y="34" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#0f172a">Kestrel Finance</text>
  <text x="70" y="48" font-family="Inter, sans-serif" font-size="11" fill="#64748b">SME Credit Document Workflow • Production Prototype</text>

  <!-- Stepper -->
  <rect y="64" width="1200" height="42" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="24" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1. Intake ➔ 2. Checklist ➔ 3. Gap Diagnostics ➔</text>
  <rect x="300" y="72" width="160" height="26" rx="6" fill="#eaf1fb" stroke="#1e56a0"/>
  <text x="380" y="89" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e56a0" text-anchor="middle">4. OCR Split-View [Active]</text>
  <text x="470" y="89" font-family="Inter, sans-serif" font-size="11" fill="#64748b">➔ 5. Spreading Sheet ➔ 6. Credit Sanction</text>

  <!-- Mandatory AI Governance Banner -->
  <rect y="106" width="1200" height="34" fill="#fef7e6" stroke="#fde09e"/>
  <text x="24" y="128" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8a5700">⚠️ Mock extraction. Not a live model. No external AI APIs called. Figure verification mandatory by Credit Analyst.</text>

  <!-- Main Split-View Canvas -->
  <g transform="translate(24, 150)">
    <!-- Left Pane: Document Viewer with Bounding Boxes -->
    <rect x="0" y="0" width="600" height="620" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="0" y="0" width="600" height="44" rx="10 10 0 0" fill="#f8fafd" stroke="#e2e8f0"/>
    <text x="16" y="27" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">HDFC Bank Current Account Statement (Page 1 of 1)</text>
    <rect x="440" y="10" width="70" height="24" rx="4" fill="#1e56a0"/>
    <text x="475" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Bank Stmt</text>
    <rect x="516" y="10" width="70" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="551" y="26" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">GSTR-3B</text>

    <!-- Scanned Statement Simulation Surface -->
    <rect x="16" y="56" width="568" height="544" rx="6" fill="#fdfdfd" stroke="#cbd5e1"/>
    
    <!-- Bank Letterhead -->
    <text x="32" y="80" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">HDFC BANK LIMITED — CURRENT ACCOUNT STATEMENT</text>
    <text x="32" y="96" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Account: 50200084729104 | IFSC: HDFC0001092 | Branch: Industrial Area, Hyderabad</text>
    <line x1="32" y1="104" x2="568" y2="104" stroke="#1e3a8a" stroke-width="1.5"/>

    <!-- Statement Summary Metrics -->
    <rect x="32" y="114" width="536" height="40" rx="4" fill="#f3f4f6"/>
    <text x="44" y="132" font-family="Inter, sans-serif" font-size="10.5" fill="#334155">Period: 01/05/2026 to 31/10/2026</text>
    <text x="220" y="132" font-family="Inter, sans-serif" font-size="10.5" fill="#334155">Total Credits: ₹ 84,50,000</text>
    <text x="400" y="132" font-family="Inter, sans-serif" font-size="10.5" fill="#334155">Total Debits: ₹ 78,20,000</text>

    <!-- Bounding Box 1: Total Credits (Highlighted) -->
    <rect x="214" y="118" width="160" height="24" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
    <rect x="214" y="104" width="60" height="14" rx="2" fill="#2563eb"/>
    <text x="244" y="114" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">OCR 98%</text>

    <!-- Statement Table -->
    <text x="32" y="180" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">DATE      PARTICULARS                CHQ/REF    CREDIT (₹)      DEBIT (₹)       BALANCE (₹)</text>
    <line x1="32" y1="188" x2="568" y2="188" stroke="#cbd5e1"/>
    <text x="32" y="208" font-family="JetBrains Mono, monospace" font-size="10" fill="#0f172a">02/05/26  NEFT Inward - Malabar Sp   N92810     14,20,000       -               18,50,000</text>
    <text x="32" y="232" font-family="JetBrains Mono, monospace" font-size="10" fill="#0f172a">18/06/26  RTGS Inward - Bulk Agro    R44102     22,00,000       -               25,40,000</text>
    <text x="32" y="256" font-family="JetBrains Mono, monospace" font-size="10" fill="#0f172a">31/07/26  Vendor Payouts - Operat    CMS812     -               12,80,000       12,60,000</text>
    
    <!-- Bounding Box 2: Calculated AMB -->
    <rect x="460" y="270" width="100" height="20" rx="3" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="32" y="284" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#0f172a">31/10/26  Month End Calculated AMB   SYS-INT    -               -                4,85,000</text>
    <text x="32" y="308" font-family="JetBrains Mono, monospace" font-size="10" fill="#0f172a">31/10/26  Inward Cheque Dishonour    RTN-00     -               -                0 Returns</text>

    <!-- Right Pane: Extracted Figures Table -->
    <rect x="624" y="0" width="528" height="620" rx="10" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <rect x="624" y="0" width="528" height="44" rx="10 10 0 0" fill="#f8fafd" stroke="#e2e8f0"/>
    <text x="640" y="27" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Extracted Figures (Source Bounding Box Mapped)</text>
    <rect x="1030" y="10" width="106" height="24" rx="4" fill="#e6f7ef"/>
    <text x="1083" y="26" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#0e6245" text-anchor="middle">Gate: Verified</text>

    <!-- Extracted Row 1 (Selected) -->
    <rect x="624" y="44" width="528" height="60" fill="#f1f6fd"/>
    <text x="640" y="70" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1e56a0">Total Operational Credits (6M)</text>
    <text x="640" y="86" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">HDFC Statement • Page 1 • total_credits</text>
    <text x="890" y="78" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#1e56a0">₹ 84,50,000</text>
    <text x="980" y="78" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">98%</text>
    <rect x="1020" y="64" width="56" height="22" rx="4" fill="#e6f7ef"/>
    <text x="1048" y="79" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">Confirmed</text>

    <!-- Extracted Row 2 -->
    <rect x="624" y="104" width="528" height="60" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="640" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Average Monthly Balance (AMB)</text>
    <text x="640" y="146" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">HDFC Statement • Page 1 • avg_monthly_balance</text>
    <text x="890" y="138" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#0f172a">₹ 4,85,000</text>
    <text x="980" y="138" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">97%</text>
    <rect x="1020" y="124" width="56" height="22" rx="4" fill="#e6f7ef"/>
    <text x="1048" y="139" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">Confirmed</text>

    <!-- Extracted Row 3 -->
    <rect x="624" y="164" width="528" height="60" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="640" y="190" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">GSTR-3B Annualized Turnover</text>
    <text x="640" y="206" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">GSTR-3B Table 3.1 • Page 2 • gst_turnover</text>
    <text x="890" y="198" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#0f172a">₹ 1,62,00,000</text>
    <text x="980" y="198" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">99%</text>
    <rect x="1020" y="184" width="56" height="22" rx="4" fill="#e6f7ef"/>
    <text x="1048" y="199" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">Confirmed</text>

    <!-- Extracted Row 4 -->
    <rect x="624" y="224" width="528" height="60" fill="#ffffff" stroke="#f1f5f9"/>
    <text x="640" y="250" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Inward Cheque Bounces</text>
    <text x="640" y="266" font-family="Inter, sans-serif" font-size="10.5" fill="#64748b">HDFC Statement • Page 1 • inward_cheque_bounces</text>
    <text x="890" y="258" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#0f172a">0 Count</text>
    <text x="980" y="258" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">99%</text>
    <rect x="1020" y="244" width="56" height="22" rx="4" fill="#e6f7ef"/>
    <text x="1048" y="259" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#0e6245" text-anchor="middle">Confirmed</text>
  </g>
</svg>
