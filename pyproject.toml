[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-finance-engine"
version = "1.0.0"
description = "Kestrel Finance — Production-Ready SME Credit Document Intelligence & Heuristics Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Kestrel Finance Limited" }
authors = [
    { name = "Kestrel Finance Underwriting Tech", email = "tech-underwriting@kestrelsme.in" }
]
keywords = ["credit-underwriting", "nbfc", "sme-loans", "document-intelligence", "ocr", "spreading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "PyMuPDF>=1.25.0",
    "pdfplumber>=0.11.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["backend/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
